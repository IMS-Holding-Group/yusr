# Render Blueprint - Yusr (no Docker)
# Repo: https://github.com/trsi-me/yusr
#
# yusr-api Settings (if not using Blueprint sync):
#   Root Directory: (empty)
#   Build Command:  pip install -r backend/requirements_minimal.txt
#   Start Command:  cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
#
# Optional persistent disk (paid): set DATABASE_PATH=/var/data/yusr.db and attach disk at /var/data

services:
  - type: web
    name: yusr-api
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r backend/requirements_minimal.txt
    startCommand: cd backend && gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: FLASK_DEBUG
        value: "false"
      - key: DATABASE_PATH
        value: data/yusr.db
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: yusr-web
    runtime: static
    buildCommand: |
      if [ ! -f deploy/dist/web/index.html ]; then
        echo "ERROR: deploy/dist/web is empty."
        echo "Run: scripts/build-flutter-web.ps1 then git push deploy/dist/web"
        exit 1
      fi
      echo "Flutter web ready."
    staticPublishPath: deploy/dist/web
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
